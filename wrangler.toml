# VITOWEB games at vitoweb.al: the site in ./public plus the room servers in ./worker.
# (The Worker and database keep their first name, "vitoweb-loja"; renaming them would mean a new Worker
#  and new storage. Players never see it.)
# Deploy:  npm install            (once)
#          npx wrangler login     (once, opens the browser)
#          npx wrangler deploy
name = "vitoweb-loja"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# One address: vitoweb.al. www.vitoweb.al and the old loja.vitoweb.al open the same site and the pages send
# visitors on to vitoweb.al (see the first line of every page). The workers.dev address is switched off.
workers_dev = false
preview_urls = false
# Cloudflare makes the DNS records and the certificates by itself (vitoweb.al is on this account).
# A custom domain can only be added where no other DNS record exists for that name.
[[routes]]
pattern = "vitoweb.al"
custom_domain = true

[[routes]]
pattern = "www.vitoweb.al"
custom_domain = true

[[routes]]
pattern = "loja.vitoweb.al"
custom_domain = true

# The room server imports the same game engine as the pages: this copies it into worker/gen.
[build]
command = "node scripts/build.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Only room traffic wakes the Worker; every page, script and image is served as a free static asset.
run_worker_first = ["/api/*", "/ws/*"]

# One Durable Object per room (Mafia, Imposter, Murlan), plus one "Guard" for the daily kill switch.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

# Accounts (Google sign-in, usernames, friends). Made once with the Cloudflare dashboard/API.
[[d1_databases]]
binding = "DB"
database_name = "vitoweb-loja"
database_id = "0318f776-30ab-425c-a70b-2e53cfda428e"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Guard"]

# Rate limits (per Cloudflare location, per minute).
# RL_IP is loose on purpose: in Albania many phones on mobile data share one public IP.
[[ratelimits]]
name = "RL_IP"
namespace_id = "41001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_CREATE"
namespace_id = "41002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_JOIN"
namespace_id = "41003"
simple = { limit = 40, period = 60 }

[vars]
# Kill switch. Set PAUSE_NEW_ROOMS = "1" and redeploy to stop new rooms at once (open rooms keep working).
PAUSE_NEW_ROOMS = "0"
# New rooms allowed per UTC day before the site refuses more.
MAX_NEW_ROOMS_PER_DAY = "2000"
# A room deletes itself after this many minutes with no activity (6 hours).
ROOM_TTL_MINUTES = "360"
# "Hyr me Google": the OAuth client id from Google Cloud (it is public, not a secret). Empty = sign-in hidden.
GOOGLE_CLIENT_ID = ""
# The dashboard (vitoweb.al/admin) opens with a key only the owner has. Only its SHA-256 is here, not the key.
ADMIN_HASH = "7cbeaf348a6f9f6c7d744f30366877ccb3d8277f26e3c804a93383a0b6927659"

# Logs in the dashboard (Workers & Pages -> vitoweb-loja -> Logs). Useful while testing.
[observability]
enabled = true
